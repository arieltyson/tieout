name: Tieout
options:
  bundleIdPrefix: com.arieltyson.tieout
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO

packages:
  TieoutCore:
    path: TieoutCore

targets:
  Tieout:
    type: application
    platform: iOS
    sources:
      - path: Tieout/Sources
      - path: Tieout/Resources
        buildPhase: resources
    info:
      path: Tieout/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Tieout
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arieltyson.tieout
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: TieoutCore
      - target: TieoutWidgets
        embed: true

  TieoutWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TieoutWidgets
    dependencies:
      - package: TieoutCore
    info:
      path: TieoutWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tieout
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arieltyson.tieout.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
